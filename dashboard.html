<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kigambo Dev Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
body{font-family:Arial;padding:12px;background:#f0f2f5;margin:0}
.top{background:#000;color:#fff;padding:14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.top button{background:#fff;color:#000;border:0;padding:8px 14px;border-radius:20px;font-weight:bold}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.card{background:#fff;padding:14px;border-radius:12px;text-align:center;box-shadow:0 1px 4px #0001}
.card h3{margin:0;font-size:13px;color:#666}
.card p{font-size:22px;font-weight:bold;margin:6px 0 0}
.box{background:#fff;padding:14px;border-radius:12px;margin-bottom:12px}
input,select{width:100%;padding:11px;margin:6px 0;box-sizing:border-box;border:1px solid #ddd;border-radius:8px}
button.btn{width:100%;padding:12px;background:#000;color:#fff;border:0;border-radius:8px;font-weight:bold}
.item{border-bottom:1px solid #eee;padding:10px 0;display:flex;justify-content:space-between}
.item:last-child{border:0}
.small{color:#666;font-size:12px}
.badge{background:#e8f5e9;color:#0a7a2e;padding:3px 8px;border-radius:20px;font-size:11px}
.del{background:#ff3b30;color:#fff;border:0;padding:5px 10px;border-radius:6px}
#loginBox{max-width:400px;margin:40px auto}
</style>
</head>
<body>

<div id="loginBox" class="box" style="display:none">
  <h2>Kigambo Dev Login</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button class="btn" onclick="login()">Login</button>
  <p id="error" style="color:red"></p>
</div>

<div id="dash" style="display:none">
  <div class="top">
    <div><b>Kigambo Coopos</b><br><span id="userEmail" style="font-size:12px;opacity:.8"></span></div>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="cards">
    <div class="card"><h3>Total Members</h3><p id="cMembers">0</p></div>
    <div class="card"><h3>Total Loans</h3><p id="cLoans">0</p></div>
    <div class="card"><h3>Total Savings</h3><p id="cSavings">UGX 0</p></div>
    <div class="card"><h3>Active Loans</h3><p id="cActive">0</p></div>
  </div>

  <div class="box">
    <h3>Add New Member</h3>
    <input id="mName" placeholder="Full Name - e.g. John Kato">
    <input id="mPhone" placeholder="Phone - 0770 123456">
    <input id="mSavings" type="number" placeholder="Initial Savings - e.g. 50000">
    <button class="btn" onclick="addMember()">+ Add Member</button>
  </div>

  <div class="box">
    <h3>Add Loan</h3>
    <select id="lMember"><option value="">Select Member...</option></select>
    <input id="lAmount" type="number" placeholder="Loan Amount - e.g. 200000">
    <input id="lReason" placeholder="Reason - e.g. School fees">
    <button class="btn" onclick="addLoan()">+ Add Loan</button>
  </div>

  <div class="box">
    <h3>Members</h3>
    <div id="membersList">Loading...</div>
  </div>

  <div class="box">
    <h3>Loans</h3>
    <div id="loansList">Loading...</div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDQqWO5diFL03O1GdBa1L_LXI8gK-eSgaQ",
  authDomain: "kigambo-coopos.firebaseapp.com",
  projectId: "kigambo-coopos",
  storageBucket: "kigambo-coopos.firebasestorage.app",
  messagingSenderId: "711731991766",
  appId: "1:711731991766:web:2bafe8d4fe922cadc3e577"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const DEV_EMAIL = "tadeoabooki@gmail.com";

function login(){
  var email=document.getElementById('email').value.trim();
  var pass=document.getElementById('password').value;
  document.getElementById('error').innerText="Logging in...";
  firebase.auth().signInWithEmailAndPassword(email,pass).catch(e=>{
    document.getElementById('error').innerText=e.message;
  });
}
function logout(){ firebase.auth().signOut(); }

firebase.auth().onAuthStateChanged(user=>{
  if(user && user.email===DEV_EMAIL){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('dash').style.display='block';
    document.getElementById('userEmail').innerText=user.email;
    loadData();
  } else if(user){
    alert("Not dev account"); firebase.auth().signOut();
  } else {
    document.getElementById('loginBox').style.display='block';
    document.getElementById('dash').style.display='none';
  }
});

function addMember(){
  var name=document.getElementById('mName').value.trim();
  var phone=document.getElementById('mPhone').value.trim();
  var savings=parseInt(document.getElementById('mSavings').value)||0;
  if(!name){ alert("Enter name"); return; }
  db.collection("members").add({name:name, phone:phone, savings:savings, createdAt: firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{
    document.getElementById('mName').value=''; document.getElementById('mPhone').value=''; document.getElementById('mSavings').value='';
    alert("Member added ✅"); loadData();
  });
}
function addLoan(){
  var memberId=document.getElementById('lMember').value;
  var memberName=document.getElementById('lMember').options[document.getElementById('lMember').selectedIndex]?.text;
  var amount=parseInt(document.getElementById('lAmount').value)||0;
  var reason=document.getElementById('lReason').value.trim();
  if(!memberId||!amount){ alert("Select member and amount"); return; }
  db.collection("loans").add({memberId:memberId, memberName:memberName, amount:amount, reason:reason, status:"active", createdAt: firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{
    document.getElementById('lAmount').value=''; document.getElementById('lReason').value='';
    alert("Loan added ✅"); loadData();
  });
}
function deleteMember(id){ if(confirm("Delete this member?")) db.collection("members").doc(id).delete().then(loadData); }
function deleteLoan(id){ if(confirm("Delete this loan?")) db.collection("loans").doc(id).delete().then(loadData); }
function markPaid(id){ db.collection("loans").doc(id).update({status:"paid"}).then(loadData); }

function loadData(){
  db.collection("members").orderBy("createdAt","desc").onSnapshot(snap=>{
    var totalSav=0, html="", sel='<option value="">Select Member...</option>';
    snap.forEach(doc=>{
      var d=doc.data(); totalSav+=d.savings||0;
      sel+='<option value="'+doc.id+'">'+d.name+'</option>';
      html+='<div class="item"><div><b>'+d.name+'</b><br><span class="small">'+(d.phone||'')+' • Savings: UGX '+(d.savings||0).toLocaleString()+'</span></div><button class="del" onclick="deleteMember(\''+doc.id+'\')">X</button></div>';
    });
    document.getElementById('membersList').innerHTML=html||"No members yet";
    document.getElementById('lMember').innerHTML=sel;
    document.getElementById('cMembers').innerText=snap.size;
    document.getElementById('cSavings').innerText="UGX "+totalSav.toLocaleString();
  });
  db.collection("loans").orderBy("createdAt","desc").onSnapshot(snap=>{
    var total=0, active=0, html="";
    snap.forEach(doc=>{
      var d=doc.data(); total+=d.amount||0; if(d.status==="active") active++;
      html+='<div class="item"><div><b>'+(d.memberName||'Member')+' - UGX '+(d.amount||0).toLocaleString()+'</b><br><span class="small">'+(d.reason||'')+' • <span class="badge">'+(d.status||'active')+'</span></span></div><div><button onclick="markPaid(\''+doc.id+'\')">Paid</button> <button class="del" onclick="deleteLoan(\''+doc.id+'\')">X</button></div></div>';
    });
    document.getElementById('loansList').innerHTML=html||"No loans yet";
    document.getElementById('cLoans').innerText=snap.size;
    document.getElementById('cActive').innerText=active;
  });
}
</script>
</body>
</html>
