<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kigambo - Coop Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial; background: #f4f6f2; padding: 12px; max-width: 1100px; margin: 0 auto; }
h1 { color: #14532d; margin: 0; font-size: 22px; }
h2 { font-size: 18px; margin: 18px 0 8px; }
.cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 14px 0; }
.card { background: #fff; padding: 14px; border-radius: 12px; border: 1px solid #e5e7eb; }
.card b { font-size: 24px; display: block; }
.card small { color: #666; }
.box { background: #fff; padding: 14px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #e5e7eb; }
input, select { width: 100%; padding: 11px; margin: 6px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
button { width: 100%; padding: 12px; background: #14532d; color: #fff; border: 0; border-radius: 10px; font-weight: bold; cursor: pointer; }
button.small { width: auto; padding: 7px 10px; font-size: 13px; background: #fff; color: #14532d; border: 1px solid #14532d; margin: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; background: #f8fafc; padding: 10px; } td { padding: 10px; border-top: 1px solid #eee; }
@media (max-width: 700px) {
  .cards { grid-template-columns: 1fr 1fr; }
  table { display: block; overflow-x: auto; }
}
#loginBox { max-width: 400px; margin: 40px auto; }
</style>
</head>
<body>

<div id="loginBox" class="box" style="display:none">
  <h1>🌿 KIGAMBO</h1>
  <p>Coop Dashboard - Login</p>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p id="error" style="color:red"></p>
</div>

<div id="dash" style="display:none">
  <h1 id="coopName">🌿 Coop Dashboard</h1>
  <p id="coopInfo" style="color:#666;margin:6px 0">Loading...</p>
  <a href="admin.html"><button class="small">← Back to Admin</button></a>
  <button class="small" onclick="logout()">Logout</button>

  <div class="cards">
    <div class="card"><small>Members</small><b id="tMembers">0</b></div>
    <div class="card"><small>Total Savings</small><b id="tSavings">0</b></div>
    <div class="card"><small>Active Loans</small><b id="tLoans">0</b></div>
  </div>

  <div class="box">
    <h2>➕ Add Member</h2>
    <input id="mName" placeholder="Full Name - e.g. Akorabirungi Michael">
    <input id="mPhone" placeholder="Phone - e.g. 0771234567">
    <input id="mSavings" type="number" placeholder="Savings UGX - e.g. 95000">
    <button onclick="addMember()">Add Member</button>
  </div>

  <div class="box">
    <h2>💰 Request Loan</h2>
    <select id="lMember"></select>
    <input id="lAmount" type="number" placeholder="Loan Amount UGX">
    <input id="lReason" placeholder="Reason - e.g. School fees / Business">
    <button onclick="requestLoan()">Request Loan</button>
  </div>

  <div class="box">
    <h2>👥 Members</h2>
    <div id="membersList">Loading...</div>
  </div>

  <div class="box">
    <h2>📋 Loans</h2>
    <div id="loansList">Loading...</div>
  </div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyDQqWO5diFL03O1GdBa1L_LXI8gK-eSgaQ",authDomain:"kigambo-coopos.firebaseapp.com",projectId:"kigambo-coopos",storageBucket:"kigambo-coopos.firebasestorage.app",messagingSenderId:"711731991766",appId:"1:711731991766:web:2bafe8d4fe922cadc3e577"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
const params=new URLSearchParams(location.search);
let coopId=params.get('coop')||localStorage.getItem('coopId')||'';
if(params.get('coop')) localStorage.setItem('coopId',coopId);

function login(){firebase.auth().signInWithEmailAndPassword(document.getElementById('email').value.trim(),document.getElementById('password').value).catch(e=>document.getElementById('error').innerText=e.message)}
function logout(){firebase.auth().signOut()}
firebase.auth().onAuthStateChanged(u=>{document.getElementById('loginBox').style.display=u?'none':'block';document.getElementById('dash').style.display=u?'block':'none';if(u)loadAll()});

function loadAll(){
  if(!coopId){document.getElementById('coopInfo').innerText="No coop selected. Go back to Admin and click View Dashboard.";return}
  db.collection("cooperatives").doc(coopId).get().then(d=>{if(d.exists){document.getElementById('coopName').innerText="🌿 "+d.data().name;document.getElementById('coopInfo').innerText=(d.data().location||'')+" • Coop ID: "+coopId}});

  db.collection("members").where("coopId","==",coopId).onSnapshot(s=>{
    let list=[]; s.forEach(d=>list.push({id:d.id,...d.data()}));
    let total=list.reduce((a,m)=>a+(m.savings||0),0);
    document.getElementById('tMembers').innerText=list.length;
    document.getElementById('tSavings').innerText=total.toLocaleString()+" UGX";
    document.getElementById('membersList').innerHTML=list.map(m=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee"><div><b>${m.name}</b><br><small>${m.phone||''} • Savings: UGX ${(m.savings||0).toLocaleString()}</small></div><button class="small" onclick="delMember('${m.id}')">🗑</button></div>`).join('')||"No members yet";
    document.getElementById('lMember').innerHTML=list.map(m=>`<option value="${m.id}|${m.name}">${m.name} - ${m.phone||''}</option>`).join('');
  });

  db.collection("loans").where("coopId","==",coopId).onSnapshot(s=>{
    let list=[]; s.forEach(d=>list.push({id:d.id,...d.data()}));
    document.getElementById('tLoans').innerText=list.filter(l=>l.status==='active').length;
    document.getElementById('loansList').innerHTML=list.map(l=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee"><div><b>${l.memberName} - UGX ${(l.amount||0).toLocaleString()}</b><br><small>${l.reason||''} • ${l.status}</small></div></div>`).join('')||"No loans yet";
  });
}

function addMember(){
  let name=document.getElementById('mName').value.trim(), phone=document.getElementById('mPhone').value.trim(), sav=parseInt(document.getElementById('mSavings').value)||0;
  if(!coopId){alert("No coop selected");return}
  if(!name||!phone){alert("Enter name and phone");return}
  db.collection("members").add({coopId,name,phone,savings:sav,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{alert("Member added ✅");document.getElementById('mName').value='';document.getElementById('mPhone').value='';document.getElementById('mSavings').value=''});
}
function requestLoan(){
  let sel=document.getElementById('lMember').value; if(!sel){alert("Add a member first");return}
  let [mid,mname]=sel.split('|'); let amt=parseInt(document.getElementById('lAmount').value)||0; let reason=document.getElementById('lReason').value.trim();
  if(!amt){alert("Enter amount");return}
  db.collection("loans").add({coopId,memberId:mid,memberName:mname,amount:amt,reason,status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{alert("Loan requested - waiting for Admin ✅");document.getElementById('lAmount').value='';document.getElementById('lReason').value=''});
}
function delMember(id){if(confirm("Delete this member?"))db.collection("members").doc(id).delete()}
</script>
</body>
      </html>
