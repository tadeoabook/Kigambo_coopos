<!DOCTYPE html>
<html><head><title>KIGAMBO DEV DASH - GOD MODE</title>
<meta name="viewport" content="width=device-width">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
body{font-family:monospace;background:#0a0a0a;color:#0f0;padding:20px}
.card{background:#111;border:1px solid #0f0;padding:15px;margin:10px 0;border-radius:8px}
button{background:#0f0;color:#000;padding:12px 20px;font-weight:bold;border:none;border-radius:5px;cursor:pointer;margin:5px}
button.kill{background:red;color:white}
.red{color:red} .green{color:#0f0}
input{padding:8px;width:90%;background:#222;color:#0f0;border:1px solid #0f0}
</style>
</head><body>
<h1>🔧 KIGAMBO DEV DASH v0.1.1</h1>
<p>Logged as: <span id="userEmail">loading...</span> | <span id="status">Checking...</span></p>

<div class="card">
<h2>🚨 MASTER KILL SWITCH</h2>
<p>System Active: <b id="sysActive">loading</b></p>
<button id="killBtn" onclick="toggleKill()">TOGGLE SYSTEM OFF/ON</button>
<input id="msg" placeholder="Maintenance message">
<button onclick="updateMsg()">Update Message</button>
<p class="red">OFF = All 8 Coops + 2450 members see maintenance screen. Only you stay in.</p>
</div>

<div class="card">
<h2>🏦 8 COOPS CONTROL</h2>
<div id="coopsList">Loading coops...</div>
</div>

<div class="card">
<h2>📊 LIVE STATS</h2>
<p>Active Today: <span id="active">312</span> | Collections: UGX <span id="cash">4.2M</span></p>
<button onclick="location.reload()">REFRESH</button>
</div>

<script>
const firebaseConfig = { // USE YOURS FROM kigambo-coopos.web.app
  apiKey: "YOUR_API_KEY",
  authDomain: "kigambo-coopos.firebaseapp.com",
  projectId: "kigambo-coopos"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

auth.onAuthStateChanged(user=>{
  if(!user || user.email !== 'tadeoabooki@gmail.com'){
    document.body.innerHTML = '<h1>⛔ ACCESS DENIED - DEV ONLY</h1><p>Login with tadeoabooki@gmail.com</p><button onclick="firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())">Login Dev</button>';
    return;
  }
  document.getElementById('userEmail').innerText = user.email;
  
  db.doc('config/global').onSnapshot(doc=>{
    if(!doc.exists){db.doc('config/global').set({isSystemActive:true,maintenanceMessage:'Upgrading...',version:'0.1.1'}); return;}
    const d = doc.data();
    document.getElementById('sysActive').innerHTML = d.isSystemActive ? '<span class=green>ON - LIVE</span>' : '<span class=red>OFF - KILLED</span>';
    document.getElementById('status').innerText = d.isSystemActive ? 'SYSTEM LIVE' : 'SYSTEM KILLED';
    document.getElementById('killBtn').innerText = d.isSystemActive ? '🔴 KILL ALL 8 COOPS NOW' : '🟢 REVIVE SYSTEM';
    document.getElementById('killBtn').className = d.isSystemActive ? 'kill' : '';
    document.getElementById('msg').value = d.maintenanceMessage;
  });
  
  db.collection('coops').onSnapshot(snap=>{
    let html=''; snap.forEach(c=>{html+=`<div>${c.id}: ${c.data().name||'Coop'} <button onclick="killCoop('${c.id}')">Kill</button></div>`});
    document.getElementById('coopsList').innerHTML = html || 'No coops yet - add /coops docs';
  });
});

function toggleKill(){
  db.doc('config/global').get().then(d=>{
    db.doc('config/global').update({isSystemActive: !d.data().isSystemActive});
  });
}
function updateMsg(){db.doc('config/global').update({maintenanceMessage: document.getElementById('msg').value}); alert('Updated');}
function killCoop(id){if(confirm('Kill '+id+'?')) db.doc('config/global').get().then(d=>{let arr=d.data().killCoops||[]; arr.includes(id)?arr=arr.filter(x=>x!==id):arr.push(id); db.doc('config/global').update({killCoops:arr})})}
</script>
</body></html>
