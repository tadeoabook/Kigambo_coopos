<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kigambo Dev</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<style>
body{font-family:Arial;padding:20px;background:#f5f5f5}
.box{background:#fff;padding:20px;border-radius:12px;max-width:400px;margin:20px auto}
input{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;border:1px solid #ddd;border-radius:8px}
button{width:100%;padding:12px;background:#000;color:#fff;border:0;border-radius:8px;font-weight:bold}
#error{color:red;margin-top:10px}
</style>
</head>
<body>

<div id="loginBox" class="box">
  <h2>Kigambo Dev Login</h2>
  <input id="email" type="email" placeholder="Email - tadeoabooki@gmail.com">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login with Email</button>
  <p id="error"></p>
</div>

<div id="devBox" class="box" style="display:none">
  <h2>Welcome Dev ✅</h2>
  <p id="userEmail"></p>
  <p>You are now logged in as developer.</p>
  <button onclick="logout()">Logout</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDQqWO5diFL03O1GdBa1L_LXI8gK-eSgaQ",
  authDomain: "kigambo-coopos.firebaseapp.com",
  projectId: "kigambo-coopos",
  storageBucket: "kigambo-coopos.firebasestorage.app",
  messagingSenderId: "711731991766",
  appId: "1:711731991766:web:2bafe8d4fe922cadc3e577"
};
firebase.initializeApp(firebaseConfig);

function login(){
  var email = document.getElementById('email').value.trim();
  var pass = document.getElementById('password').value;
  document.getElementById('error').innerText = "Logging in...";
  firebase.auth().signInWithEmailAndPassword(email, pass)
    .catch(function(e){
      document.getElementById('error').innerText = e.message;
    });
}

function logout(){
  firebase.auth().signOut();
}

firebase.auth().onAuthStateChanged(function(user){
  if(user && user.email === "tadeoabooki@gmail.com"){
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('devBox').style.display = 'block';
    document.getElementById('userEmail').innerText = user.email;
  } else if(user){
    document.getElementById('error').innerText = "This account is not the dev account.";
    firebase.auth().signOut();
  } else {
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('devBox').style.display = 'none';
  }
});
</script>
</body>
</html>
